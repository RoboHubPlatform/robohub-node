# robohub-node's CI: the shared RoboHub workflow, with robohub-common beside it;
# tests/tests.yml runs every module's suites.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: RoboHubPlatform/robohub/.github/workflows/robohub-ci.yml@main
    secrets: inherit
    with:
      # robohub-devices and robohub-esp32: requirements here satisfy and verify
      # theirs (DEVS-*, ESP-0010). robohub-pico: the template test builds the
      # template for a Pico 2 W, with rho-target's compiler.
      siblings: robohub-common robohub-devices robohub-esp32 robohub-pico
      machine_install: rho-target:arm-none-eabi-gcc
